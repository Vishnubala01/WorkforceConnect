
name: WorkforceConnect - Build and Push to ECR

on:
  push:
    branches:
      - main
      - devops/github-actions-cicd

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_API_REPOSITORY: workforceconnect-api
  ECR_FRONTEND_REPOSITORY: workforceconnect-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Display GitHub execution context
      - name: Display GitHub execution context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Reference: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      # Step 3: Inspect actual OIDC token claims
      - name: Inspect OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            for (const key of [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'ref',
              'workflow_ref',
              'environment'
            ]) {
              core.info(`${key}: ${payload[key] ?? 'not present'}`);
            }

      # Step 4: Configure AWS credentials using OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 5: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Generate image tag
      - name: Generate image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Step 7: Build and push backend image
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG \
            -f backend/src/WorkforceConnect.Api/Dockerfile \
            backend

          docker push $REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG

      # Step 8: Build and push frontend image
      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG \
            -f frontend/Dockerfile \
            frontend

          docker push $REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
