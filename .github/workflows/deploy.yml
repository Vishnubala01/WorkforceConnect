
name: WorkforceConnect - CI/CD to AWS EC2

on:
  push:
    branches:
      - main
      - devops/github-actions-cicd

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_API_REPOSITORY: workforceconnect-api
  ECR_FRONTEND_REPOSITORY: workforceconnect-frontend

jobs:
  # ==========================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGES TO ECR
  # ==========================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display GitHub execution context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Reference: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      - name: Inspect OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            for (const key of [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'ref',
              'workflow_ref',
              'environment'
            ]) {
              core.info(`${key}: ${payload[key] ?? 'not present'}`);
            }

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" \
            -f backend/src/WorkforceConnect.Api/Dockerfile \
            backend

          docker push "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            -f frontend/Dockerfile \
            frontend

          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

  # ==========================================
  # JOB 2: AUTOMATIC DEPLOYMENT TO EC2 VIA SSM
  # ==========================================
  deploy-to-ec2:
    name: Deploy to EC2 using SSM
    needs: build-and-push
    runs-on: ubuntu-latest

    # Test CD only on the DevOps branch initially.
    if: github.ref == 'refs/heads/devops/github-actions-cicd'

    concurrency:
      group: workforceconnect-ec2-deployment
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command through SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$INSTANCE_ID" ]; then
            echo "Missing EC2_INSTANCE_ID GitHub secret"
            exit 1
          fi

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          cd /home/ubuntu/workforceconnect

          test -f .env
          test -f compose.prod.yaml
          grep -q '^IMAGE_TAG=' .env

          sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env

          aws ecr get-login-password --region ap-south-1 | docker login \\
            --username AWS \\
            --password-stdin 435466091315.dkr.ecr.ap-south-1.amazonaws.com

          docker compose -f compose.prod.yaml pull backend frontend

          docker compose -f compose.prod.yaml up -d \\
            --no-deps backend frontend

          docker compose -f compose.prod.yaml ps
          EOF
          )

          PARAMETERS=$(jq -n \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WorkforceConnect $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment command completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
