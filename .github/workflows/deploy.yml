
name: WorkforceConnect - CI/CD to AWS EC2

on:
  push:
    branches:
      - main
      - devops/github-actions-ci-cd

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_API_REPOSITORY: workforceconnect-api
  ECR_FRONTEND_REPOSITORY: workforceconnect-frontend

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGES TO ECR
  # ==========================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display GitHub execution context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Reference: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      - name: Inspect OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            for (const key of [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'ref',
              'workflow_ref',
              'environment'
            ]) {
              core.info(`${key}: ${payload[key] ?? 'not present'}`);
            }

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" \
            -f backend/src/WorkforceConnect.Api/Dockerfile \
            backend

          docker push "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            -f frontend/Dockerfile \
            frontend

          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"


  # ==========================================
  # JOB 2: AUTOMATIC EC2 STARTUP AND DEPLOYMENT
  # ==========================================
  deploy-to-ec2:
    name: Deploy to EC2 using SSM
    needs: build-and-push
    runs-on: ubuntu-latest

    # Deploy only from DevOps branch during testing.
    if: github.ref == 'refs/heads/devops/github-actions-ci-cd'

    concurrency:
      group: workforceconnect-ec2-deployment
      cancel-in-progress: false

    steps:

      # STEP 1: AUTHENTICATE WITH AWS
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # STEP 2: CHECK EC2 STATE AND START IF REQUIRED
      - name: Check and start EC2 instance
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$INSTANCE_ID" ]; then
            echo "Missing EC2_INSTANCE_ID GitHub secret."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current EC2 state: $STATE"

          case "$STATE" in
            stopped)
              echo "EC2 is stopped. Starting instance..."
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
              ;;
            stopping)
              echo "EC2 is stopping. Waiting for it to stop..."

              aws ec2 wait instance-stopped \
                --instance-ids "$INSTANCE_ID"

              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
              ;;
            running)
              echo "EC2 is already running."
              ;;
            pending)
              echo "EC2 is already starting."
              ;;
            *)
              echo "Cannot deploy. Current EC2 state: $STATE"
              exit 1
              ;;
          esac

          echo "Waiting for EC2 running state..."

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          echo "Waiting for EC2 status checks..."

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is ready."


      # STEP 3: WAIT FOR SSM AGENT
      - name: Wait for SSM Agent to become online
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          echo "Waiting for SSM Agent..."

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM Agent is online."
              exit 0
            fi

            sleep 10
          done

          echo "SSM Agent did not become online within 10 minutes."
          exit 1


      # STEP 4: SEND DEPLOYMENT COMMAND THROUGH SSM
      - name: Send deployment command through SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE_TAG"

          DEPLOY_SCRIPT="$(
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            cat <<'SSM_SCRIPT'
          set -Eeuo pipefail

          cd /home/ubuntu/workforceconnect

          test -f .env
          test -f compose.prod.yaml
          grep -q '^IMAGE_TAG=' .env

          # Save the previous working image tag.
          PREVIOUS_IMAGE_TAG=$(grep '^IMAGE_TAG=' .env | cut -d '=' -f2-)

          if [ -z "$PREVIOUS_IMAGE_TAG" ]; then
            echo "Previous image tag is empty. Cannot safely deploy."
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE_TAG"
          echo "New image: $IMAGE_TAG"

          # Rollback function.
          rollback() {
            DEPLOY_EXIT_CODE=$?

            trap - ERR
            set +e

            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "Starting automatic rollback..."
            echo "Restoring image: $PREVIOUS_IMAGE_TAG"
            echo "======================================"

            # Restore previous image tag.
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_IMAGE_TAG}/" .env

            # Pull previous working images.
            docker compose -f compose.prod.yaml pull backend frontend

            if [ $? -ne 0 ]; then
              echo "ERROR: Could not pull previous images."
              exit 1
            fi

            # Recreate previous application containers.
            docker compose -f compose.prod.yaml up -d \
              --no-deps backend frontend

            if [ $? -ne 0 ]; then
              echo "ERROR: Could not restart previous containers."
              exit 1
            fi

            sleep 10

            # Verify rollback.
            for service in backend frontend; do
              CONTAINER_ID=$(docker compose -f compose.prod.yaml ps -q "$service")

              if [ -z "$CONTAINER_ID" ]; then
                echo "ERROR: $service container missing after rollback."
                exit 1
              fi

              STATUS=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_ID")

              if [ "$STATUS" != "running" ]; then
                echo "ERROR: $service is not running after rollback."
                exit 1
              fi
            done

            # Verify frontend response.
            curl -fsS http://localhost:8081 -o /dev/null

            if [ $? -ne 0 ]; then
              echo "ERROR: Frontend verification failed after rollback."
              exit 1
            fi

            echo "======================================"
            echo "ROLLBACK COMPLETED SUCCESSFULLY"
            echo "Previous version: $PREVIOUS_IMAGE_TAG"
            echo "======================================"

            docker compose -f compose.prod.yaml ps

            # Preserve original deployment failure.
            exit "$DEPLOY_EXIT_CODE"
          }

          # Activate automatic rollback on command failure.
          trap rollback ERR

          # Authenticate Docker to Amazon ECR.
          aws ecr get-login-password --region ap-south-1 | docker login \
            --username AWS \
            --password-stdin 435466091315.dkr.ecr.ap-south-1.amazonaws.com

          # Update the deployed image tag.
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

          # Pull updated application images.
          docker compose -f compose.prod.yaml pull backend frontend

          # Recreate backend and frontend only.
          docker compose -f compose.prod.yaml up -d \
            --no-deps backend frontend

          sleep 10

          # Verify application containers.
          for service in backend frontend; do
            CONTAINER_ID=$(docker compose -f compose.prod.yaml ps -q "$service")

            test -n "$CONTAINER_ID"

            STATUS=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_ID")

            test "$STATUS" = "running"

            echo "$service container is running."
          done

          # Verify frontend response.
          curl -fsS http://localhost:8081 -o /dev/null

          # Deployment succeeded. Disable rollback trap.
          trap - ERR

          echo "======================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "Deployed image: $IMAGE_TAG"
          echo "======================================"

          docker compose -f compose.prod.yaml ps

          SSM_SCRIPT
          )"

          PARAMETERS=$(jq -n \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WorkforceConnect $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"


      # STEP 5: WAIT FOR DEPLOYMENT RESULT
      - name: Wait for deployment result
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
